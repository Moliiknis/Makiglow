<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Makiglow: Soft, natural glow for After Effects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a11"/><stop offset="1" stop-color="#12121c"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffc56b"/><stop offset=".55" stop-color="#ff7a3d"/><stop offset="1" stop-color="#ff3d7f"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#ffc56b"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="ball" cx=".35" cy=".35"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffc56b"/><stop offset="1" stop-color="#ff7a3d"/></radialGradient>
    <radialGradient id="wheelCenter"><stop offset="0" stop-color="#ddd"/><stop offset=".25" stop-color="#bbb" stop-opacity=".8"/><stop offset="1" stop-color="#888" stop-opacity="0"/></radialGradient>
    <linearGradient id="frameFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a3a"/><stop offset="1" stop-color="#1a1a26"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blurMid" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blurSmall" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="streak" x="-80%" y="-20%" width="260%" height="140%"><feGaussianBlur stdDeviation="26 2"/></filter>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>
