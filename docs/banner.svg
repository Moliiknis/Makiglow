    <text x="84" y="232" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="100" font-weight="800" letter-spacing="-2" fill="url(#titleGrad)">Makiglow</text>
